# Reusable build + push pipeline for the Instruqt track in this repo.
#
# - build-image: rebuilds the sandbox image from instruqt/docker/Dockerfile. Runs only
#   when build_image=true (the caller sets that when demo*/** or docker/**
#   changed, or on manual dispatch).
# - push-track: `instruqt track push --force` to publish the track definition.
#   Do not commit checksum-only writeback after CI owns pushes.
#
# Auth: the CLI reads the INSTRUQT_TOKEN env var. Set a repo secret named
# INSTRUQT_TOKEN to an org API key (Instruqt -> Team Settings -> API keys). The
# destination org comes from `owner:` in track.yml, not a CLI flag.
#
# Image registry: this track uses a public Docker Hub image (not GHCR) because
# the temporal-community org policy blocks public GHCR packages, and Instruqt
# cannot pull a private image without registry credentials. Requires two repo
# secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
name: track-ci (reusable)

on:
  workflow_call:
    inputs:
      image:
        description: Full Docker Hub image ref for the sandbox (no tag).
        type: string
        required: true
      build_image:
        description: Rebuild the sandbox image.
        type: boolean
        default: false
      push_track:
        description: Push the track definition to Instruqt.
        type: boolean
        default: false

jobs:
  build-image:
    if: ${{ inputs.build_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ${{ inputs.image }}
        run: |
          if [ "$REF_NAME" = "main" ]; then
            echo "extra=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "extra=${IMAGE}:${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: instruqt/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.tags.outputs.extra }}
            ${{ inputs.image }}:${{ github.sha }}

  push-track:
    needs: build-image
    # Run after the image build when there is one, but also when only the track
    # definition changed (build-image skipped). Block only if the build FAILED
    # or was cancelled.
    if: >-
      ${{ always()
          && inputs.push_track
          && needs.build-image.result != 'failure'
          && needs.build-image.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Instruqt CLI
        run: |
          curl -fsSL \
            https://github.com/instruqt/cli/releases/latest/download/instruqt-linux.zip \
            -o instruqt.zip
          unzip -q instruqt.zip
          sudo install -m 0755 instruqt /usr/local/bin/instruqt
          instruqt version

      - name: Validate track
        working-directory: instruqt
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: instruqt track validate

      - name: Push track to Instruqt
        working-directory: instruqt
        env:
          INSTRUQT_TOKEN: ${{ secrets.INSTRUQT_TOKEN }}
        run: instruqt track push --force

      - name: Note checksum writeback policy
        run: echo "Track pushed with --force. Do not commit checksum-only writeback from CI."
