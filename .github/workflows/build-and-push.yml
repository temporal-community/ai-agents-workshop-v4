# Builds the Instruqt sandbox image and publishes the track. The `changes`
# job splits demo*/docker (baked into the image) from instruqt/ (track
# definition only), so a prose- or config-only edit still pushes the track
# without a wasteful image rebuild.
#
# Required once: a repo secret named INSTRUQT_TOKEN (org API key), plus
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (the sandbox image is public on
# Docker Hub, not GHCR - temporal-community org policy blocks public GHCR
# packages, and Instruqt can't pull a private image without credentials).
name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - "demo1-agentic-loop/**"
      - "demo2-openai-temporal-integration/**"
      - "demo3-mcp/**"
      - "demo4-hitl/**"
      - "demo5-multi-agent/**"
      - "demo6a-different-sdks/**"
      - "demo6b-different-languages/**"
      - "instruqt/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      track: ${{ steps.filter.outputs.track }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docker:
              - 'instruqt/docker/**'
              - 'demo1-agentic-loop/**'
              - 'demo2-openai-temporal-integration/**'
              - 'demo3-mcp/**'
              - 'demo4-hitl/**'
              - 'demo5-multi-agent/**'
              - 'demo6a-different-sdks/**'
              - 'demo6b-different-languages/**'
            track:
              - 'instruqt/**'

  ci:
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/_track-ci.yml
    with:
      image: docker.io/nadvolod/ai-agents-workshop-v4-sandbox
      build_image: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
      push_track: ${{ needs.changes.outputs.track == 'true' || needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit
