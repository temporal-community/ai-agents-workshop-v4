title: Build AI Agents That Survive Failure (TypeScript + LangChain)
teaser: Take an OpenAI Agents SDK agent from a script that dies with its process to
  a fleet of specialists, in two languages, that survive anything.
description: |-
  A hands-on workshop in TypeScript. You start with an ordinary OpenAI Agents
  SDK agent and, over four challenges, make it durable, pause it for a human,
  split it into independently deployable specialists that run in parallel, and
  finally reach across a language boundary to a Python LangChain Deep Agent -
  without the orchestrator ever knowing.

  Each challenge adds exactly one capability, and each one ends in the Temporal
  Web UI so you can see the shape of what you just built in the Event History.

  Everything runs against one local Temporal dev server. There is no
  infrastructure to provision and no API key to bring.
