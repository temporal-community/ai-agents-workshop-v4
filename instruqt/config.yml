version: "3"
containers:
- name: workshop
  image: nadvolod/ai-agents-webinar-sandbox:latest
  shell: /bin/bash
  memory: 6144
  # Every port a challenge tab points at. Instruqt's proxy returns HTTP 572
  # (target host connection failed) for ports that aren't exposed here.
  ports:
  - 5000   # Network Control Panel
  - 8080   # Editor (code-server)
  - 8090   # Architecture, multi-agent module
  - 8092   # Architecture, human-in-the-loop module
  - 8233   # Temporal UI
secrets:
- name: TEMPORAL_LITELLM_BROKER_SECRET
